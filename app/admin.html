<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ — SLAB//GLASS</title><link rel="stylesheet" href="style.css"></head><body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<header class="glass bar"><a class="logo" href="/">SLAB//ADMIN</a><nav><a class="btn" href="/">Магазин</a></nav></header>
<div id="login" class="glass panel" style="max-width:420px;margin:8vh auto"><h2>Вход админа</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Пароль"><p class="msg" id="m"></p><button class="btn hot" id="go">Войти</button></div>
<div id="app" hidden>
<div class="stats panel" id="stats"></div>
<div class="glass panel"><h2>Товары</h2><div class="wrap"><table id="pt"></table></div>
<h3>Добавить / изменить</h3><input id="pn" placeholder="Название"><input id="pd" placeholder="Описание"><input id="pp" type="number" min="0" step="0.01" placeholder="Цена"><input id="ps" type="number" min="0" step="1" placeholder="Остаток">
<p class="msg" id="pm"></p><button class="btn hot" id="save">Сохранить</button> <button class="btn" id="reset">Сбросить</button></div>
<div class="glass panel"><h2>Пользователи</h2><div class="wrap"><table id="ut"></table></div></div>
<div class="glass panel"><h2>Заказы</h2><div class="wrap"><table id="ot"></table></div></div></div>
<script src="admin.js"></script></body></html>
