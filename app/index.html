<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLAB//GLASS — магазин</title><link rel="stylesheet" href="style.css"></head><body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<header class="glass bar"><a class="logo" href="/">SLAB//GLASS</a><nav>
<button id="authBtn" class="btn">Вход</button><a id="adminLink" class="btn alt" href="/admin" hidden>Админка</a><button id="cartBtn" class="btn hot">Корзина <b id="cnt">0</b></button></nav></header>
<main><section class="hero"><h1 id="title" data-t="Жидкое стекло. Жёсткий бетон."></h1>
<p class="glass">Магазин в стиле brutal + liquid glass. Регистрируйтесь, собирайте корзину, оформляйте заказ.</p>
<div><a class="btn hot big" href="#shop">В каталог ↓</a></div></section>
<div class="ticker"><div id="tk"></div></div>
<section id="shop"><h2>Каталог</h2><div id="grid" class="grid"></div></section></main>
<dialog id="authDlg" class="glass"><div class="tabs"><button class="btn sm alt" data-m="login">Вход</button><button class="btn sm" data-m="register">Регистрация</button></div>
<input id="fName" placeholder="Имя" autocomplete="name" hidden><input id="fEmail" type="email" placeholder="Email" autocomplete="email"><input id="fPass" type="password" placeholder="Пароль (от 8 символов)" autocomplete="current-password">
<p class="msg" id="authMsg"></p><button id="authGo" class="btn hot">Продолжить</button> <button id="authX" class="btn">Закрыть</button></dialog>
<aside id="cart" class="glass drawer"><h2>Корзина</h2><div id="items"></div><div class="price" id="total"></div><p class="msg" id="cartMsg"></p><button id="buy" class="btn hot">Оформить</button><button id="cartX" class="btn">Закрыть</button><button id="logout" class="btn sm" hidden>Выйти</button></aside>
<script src="app.js"></script></body></html>
